{% extends 'base.html' %}

{% block title %}Sign Out - {{ site_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="fas fa-sign-out-alt fa-4x text-dark mb-3"></i>
                        <h4>Sign Out</h4>
                        <p class="text-muted">Are you sure you want to sign out?</p>
                    </div>

                    <form method="POST" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        
                        {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                        {% endif %}
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark btn-lg">
                                <i class="fas fa-sign-out-alt me-2"></i>Yes, Sign Out
                            </button>
                            <a href="{% url 'core:home' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-home me-2"></i>No, Take Me Home
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
